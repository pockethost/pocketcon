<svg xmlns="http://www.w3.org/2000/svg" viewBox="290 90 620 620">
  <title>PocketCon</title>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a" />
      <stop offset="0.5" stop-color="#ff7a45" />
      <stop offset="1" stop-color="#ff3d6e" />
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d6e" />
      <stop offset="0.5" stop-color="#ff7a45" />
      <stop offset="1" stop-color="#ffd25a" />
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f3f" />
      <stop offset="1" stop-color="#141824" />
    </linearGradient>
    <linearGradient id="capSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a45" />
      <stop offset="1" stop-color="#c43a2a" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <!-- Retro sun: solid on top, sliced into thinning bands below -->
    <mask id="slices">
      <rect width="1200" height="1200" fill="#fff" />
      <g fill="#000">
        <rect x="0" y="400" width="1200" height="8" />
        <rect x="0" y="442" width="1200" height="12" />
        <rect x="0" y="484" width="1200" height="16" />
        <rect x="0" y="526" width="1200" height="20" />
        <rect x="0" y="568" width="1200" height="24" />
        <rect x="0" y="610" width="1200" height="28" />
      </g>
    </mask>
  </defs>
  <circle cx="600" cy="400" r="305" fill="url(#sun)" mask="url(#slices)" />
  <g transform="translate(600 430) rotate(-6)">
    <rect x="-200" y="-182" width="400" height="400" rx="70" fill="#0b0d12" opacity="0.55" transform="translate(18 26)" />
    <rect x="-200" y="-192" width="400" height="400" rx="70" fill="url(#capSide)" />
    <rect x="-200" y="-222" width="400" height="400" rx="70" fill="url(#capTop)" stroke="#f4f1ea" stroke-width="14" />
    <rect x="-172" y="-194" width="344" height="344" rx="48" fill="none" stroke="#f4f1ea" stroke-opacity="0.12" stroke-width="4" />
    <rect x="-193" y="-215" width="386" height="386" rx="64" fill="url(#shine)" />
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="34">
      <!-- P, top left -->
      <path d="M-118 -150 V22 M-118 -150 H-64 A52 52 0 0 1 -64 -46 H-118" stroke="#f4f1ea" />
      <!-- C, bottom right -->
      <path d="M126 -12 A82 82 0 1 0 126 112" stroke="url(#hot)" />
    </g>
  </g>
</svg>
